<svg width="100%" height="100%" viewBox="0 0 950 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="footerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="950" height="140" rx="14" fill="url(#footerBg)"/>
  <rect width="950" height="140" rx="14" fill="url(#footerGrid)"/>

  <!-- Top Wave Accent -->
  <path d="M0,15 C200,28 380,5 560,20 C740,35 860,10 950,18 L950,0 L0,0 Z" fill="url(#footerWave)"/>

  <!-- Closing Statement Text -->
  <text x="475" y="70" text-anchor="middle" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="1.5px">
    &quot;Biến ý tưởng thành công cụ thực tiễn — Tự động hoá mọi rào cản.&quot;
  </text>
  <text x="475" y="100" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="14" letter-spacing="2px">
    CRAFTED WITH PASSION BY TIUDAIZA95  •  THANK YOU FOR VISITING!
  </text>

  <!-- Border -->
  <rect x="1" y="1" width="948" height="138" rx="13" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
</svg>
